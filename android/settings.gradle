pluginManagement {
    def flutterSdkPath = {
        def properties = new Properties()
        file("local.properties").withInputStream { properties.load(it) }
        def flutterSdkPath = properties.getProperty("flutter.sdk")
        assert flutterSdkPath != null, "flutter.sdk not set in local.properties"
        return flutterSdkPath
    }
    settings.ext.flutterSdkPath = flutterSdkPath()

    includeBuild("${settings.ext.flutterSdkPath}/packages/flutter_tools/gradle")

    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    id "dev.flutter.flutter-plugin-loader" version "1.0.0"
    id "com.android.application" version "8.5.2" apply false
    // 2.x обязателен: play-services-measurement (приходит с firebase-analytics)
    // собран с метаданными Kotlin 2.1, и компилятор 1.9 их просто не читает —
    // сборка падает на «incompatible version of Kotlin».
    id "org.jetbrains.kotlin.android" version "2.1.0" apply false
    id "com.google.gms.google-services" version "4.4.2" apply false
    id "com.google.firebase.crashlytics" version "2.9.9" apply false
    // Автоматические трассы Performance Monitoring (старт приложения, отрисовка
    // экранов, ANR). Без этого плагина работают только ручные Trace/HttpMetric.
    id "com.google.firebase.firebase-perf" version "1.4.2" apply false
}

include ":app"
